[workspace]

[package]
name = "lan-mouse-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["tray"]
tray = ["dep:ksni", "dep:tray-icon"]

[lib]
name = "lan_mouse_gpui"
path = "src/lib.rs"

[[bin]]
name = "lan-mouse-gpui"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11", "windows-manifest"] }
lan-mouse-ipc = { path = "../lan-mouse-ipc" }
async-channel = "2"
hostname = "0.4"
if-addrs = "0.15"
env_logger = "0.11"
log = "0.4"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"
