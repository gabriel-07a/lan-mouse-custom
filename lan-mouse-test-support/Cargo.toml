publish = false

[dependencies]
input-event = { path = "../input-event" }
lan-mouse-ipc = { path = "../lan-mouse-ipc" }
lan-mouse-proto = { path = "../lan-mouse-proto" }
tempfile = "3"
tokio = { version = "1.32.0", features = ["macros", "rt", "sync", "time"] }
