# cargo-deny: checked in CI (.github/workflows/audit.yml) on every push.
#   cargo deny check
# - advisories: known vulnerabilities (RustSec) fail the build;
# - licenses: every dependency must be compatible with GPL-3.0-or-later;
# - bans: duplicate versions are reported, not fatal;
# - sources: crates only from crates.io (no unknown registries or git).

[graph]
# The targets we ship for; a Windows- or Linux-only dependency is checked too.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
]
all-features = true

[advisories]
# Vulnerabilities always fail; unmaintained crates only when we use them
# directly (a transitive one is up to its parent to replace).
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # crypto-bigint 0.5 (via p256/p384 -> webrtc-dtls 0.12): possible timing
    # side channels in "constant-time" arithmetic. The fix is 0.7.6, a major
    # version the elliptic-curve 0.13 stack cannot take; it goes away when
    # webrtc-dtls moves to the RustCrypto 0.14 crates. Exposure here: the
    # DTLS handshake's ECDHE/ECDSA, observable only by timing this machine
    # closely on the local network.
    { id = "RUSTSEC-2026-0387", reason = "fix needs a webrtc-dtls release on elliptic-curve 0.14" },
    # tokio's safe AsyncFd constructors accept any fd (unsound API, not a bug
    # in a caller that passes an owned fd). The main workspace is on a fixed
    # tokio and uses `AsyncFd::register`; lan-mouse-gpui cannot move yet: the
    # fixed tokio needs libc >= 0.2.190, which breaks xattr 0.2 pulled in by
    # gpui (zed-async-tar), and the GUI never constructs an AsyncFd.
    { id = "RUSTSEC-2026-0386", reason = "lan-mouse-gpui only: blocked by gpui's xattr 0.2; no AsyncFd use" },
]

[licenses]
confidence-threshold = 0.8
# Shared with lan-mouse-gpui/ (it finds this file in the parent directory),
# so a license only one of the two workspaces uses is "not encountered" in
# the other: that warning is expected.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
