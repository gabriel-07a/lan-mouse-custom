[package]
name = "input-clipboard"
description = "cross-platform clipboard sync primitives for lan-mouse"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
async-trait = "0.1.80"
futures = "0.3.28"
lan-mouse-proto = { path = "../lan-mouse-proto", version = "0.3.0" }
log = "0.4.22"
png = "0.18.1"
sha2 = "0.10.8"
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13.1", features = ["allow-unsafe-code"] }
wl-clipboard-rs = "0.9"
ashpd = { version = "0.13.9", default-features = false, features = [
    "clipboard",
    "remote_desktop",
    "screencast",
    "tokio",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
] }

[dev-dependencies]
tokio = { version = "1.32.0", features = ["macros", "rt", "sync", "time"] }
