name: Nix Binary Cache

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    strategy:
      matrix:
        os:
          - ubuntu-latest
    name: "Build"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      # - uses: DeterminateSystems/nix-installer-action@main
      #   with:
      #     logger: pretty
      # - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: cachix/install-nix-action@d698718aa798980d17dd749f03beae0b51183399 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: lan-mouse
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build lan-mouse (x86_64-linux)
        if: matrix.os == 'ubuntu-latest'
        run: nix build --print-build-logs --show-trace .#packages.x86_64-linux.lan-mouse
