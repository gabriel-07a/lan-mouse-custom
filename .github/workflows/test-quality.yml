name: Test quality

# Quality gates that are too slow for every push: coverage, flake detection and
# mutation testing. They run manually and weekly until the baseline is stable,
# then coverage can move to the pull-request workflow with a ratchet threshold.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read

jobs:
  coverage:
    name: coverage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - uses: taiki-e/install-action@41e135bca37b18b5a9cc134855b5b3bccbedbf26 # cargo-llvm-cov
      - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest

      - name: Coverage report
        # Same ratchet floor as the per-push job in rust.yml.
        run: scripts/coverage.sh --check "$(cat .github/coverage-floor)"

      - name: Upload LCOV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: error

  flake:
    name: flake detection (3 runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - uses: taiki-e/install-action@2b545d4fd42fdd72ed2a44eab8fedd1850e8f731 # nextest

      - name: Repeat the workspace suite
        run: scripts/test-repeat.sh --runs 3 --all-features

  mutation:
    name: mutation (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - uses: taiki-e/install-action@d192932f0b384f15948fe5e42d0ec7349e4a0dd8 # cargo-mutants

      - name: Mutate the protocol crate
        run: cargo mutants -p lan-mouse-proto --in-place --timeout 120

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz proto_decode for 60 s
        run: cargo +nightly fuzz run proto_decode -- -max_total_time=60
      - name: Fuzz clipboard_transfer for 60 s
        run: cargo +nightly fuzz run clipboard_transfer -- -max_total_time=60
      - name: Fuzz file_bundle for 60 s
        run: cargo +nightly fuzz run file_bundle -- -max_total_time=60

  gnome:
    # Real GNOME Shell (headless, Ubuntu mode with the auto-hiding dock): the
    # libei backend on an EIS socket from Mutter, pushing the dock open from
    # remote control on three monitor layouts (tests/gnome-headless/).
    # The runner's GNOME is older than the desktops we ship to; kept
    # non-blocking until it has a green baseline there.
    name: GNOME e2e (headless gnome-shell)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev \
            gnome-shell gnome-shell-extension-ubuntu-dock ubuntu-session \
            dconf-cli dbus-daemon
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Single monitor
        run: RUST_LOG=input_emulation=debug scripts/gnome-headless.sh --test
      - name: Laptop panel at 5/3 scale
        env:
          GNOME_HEADLESS_SIZE: 2560x1600
          GNOME_HEADLESS_MONITORS: tests/gnome-headless/laptop-fractional.xml
        run: RUST_LOG=input_emulation=debug scripts/gnome-headless.sh --test
      - name: Panel next to a taller monitor
        env:
          GNOME_HEADLESS_SIZE: 2560x1600 2560x1440
          GNOME_HEADLESS_MONITORS: tests/gnome-headless/laptop-and-monitor.xml
        run: RUST_LOG=input_emulation=debug scripts/gnome-headless.sh --test

