name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt
        run: cargo fmt --check

  ci:
    name: ${{ matrix.job }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022
          - windows-2025
        job:
          - build
          - check
          - clippy
          - test
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libadwaita-1-dev libgtk-4-dev \
            libwayland-dev libxkbcommon-dev

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Linux'

      - name: cargo build (Linux)
        if: runner.os == 'Linux' && matrix.job == 'build'
        run: cargo build

      - name: cargo build & smoke test (Windows)
        if: runner.os == 'Windows' && matrix.job == 'build'
        shell: msys2 {0}
        run: |
          cargo build
          ./target/debug/lan-mouse.exe doctor --probe --json

      - name: cargo check (Linux)
        if: runner.os == 'Linux' && matrix.job == 'check'
        run: cargo check --workspace --all-targets --all-features

      - name: cargo check (Windows)
        if: runner.os == 'Windows' && matrix.job == 'check'
        shell: msys2 {0}
        run: cargo check --workspace --all-targets

      - name: cargo test (Linux)
        if: runner.os == 'Linux' && matrix.job == 'test'
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --workspace --all-features 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          {
            echo "--- failing tests ---"
            grep -E '^test .* FAILED|panicked at|---- .* stdout ----|assertion|test result: FAILED' test.log | head -20
            echo "--- tail ---"
            tail -n 15 test.log
          } | head -25 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit "$status"

      - name: cargo test (Windows)
        if: runner.os == 'Windows' && matrix.job == 'test'
        shell: msys2 {0}
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --workspace -- --test-threads=1 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          {
            echo "--- failing tests ---"
            grep -E '^test .* FAILED|panicked at|---- .* stdout ----|assertion|test result: FAILED' test.log | head -20
            echo "--- tail ---"
            tail -n 15 test.log
          } | head -25 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit "$status"

      - name: cargo clippy (Linux)
        if: runner.os == 'Linux' && matrix.job == 'clippy'
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          # Turn compiler/clippy diagnostics into check annotations so the
          # exact failure is visible through the public checks API even
          # without repository-admin access to the raw job log.
          {
            echo "--- diagnostics ---"
            grep -E 'warning:|error(\[|:)' clippy.log | head -12
            echo "--- tail ---"
            tail -n 6 clippy.log
          } | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit "$status"

      - name: cargo clippy (Windows)
        if: runner.os == 'Windows' && matrix.job == 'clippy'
        shell: msys2 {0}
        env:
          CARGO_TERM_COLOR: never
          # `cargo clippy` on this runner picked the MSVC toolchain for the
          # build scripts, which then linked against MSVC import libraries
          # (LNK1181: cannot open input file 'gio-2.0.lib'). Drive the MSYS2
          # GNU rustc/clippy directly instead of going through the ambiguous
          # cargo-clippy shim.
          RUSTC: /ucrt64/bin/rustc.exe
          RUSTC_WORKSPACE_WRAPPER: /ucrt64/bin/clippy-driver.exe
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          # `cargo check` does not accept `-- -D warnings`; pass the lint
          # level through RUSTFLAGS instead.
          RUSTFLAGS: -D warnings
        run: |
          set +e
          /ucrt64/bin/cargo.exe check --workspace --all-targets 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          {
            echo "--- diagnostics ---"
            grep -E 'warning:|error(\[|:)' clippy.log | head -12
            echo "--- tail ---"
            tail -n 6 clippy.log
          } | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit "$status"
