name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo fmt
        run: cargo fmt --check

  ci:
    name: ${{ matrix.job }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022
          - windows-2025
          - macos-latest
          - macos-15-intel
        job:
          - build
          - check
          - clippy
          - test
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libadwaita-1-dev libgtk-4-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install gtk4 libadwaita imagemagick

      - name: Record macOS native lib versions for cache key
        if: runner.os == 'macOS'
        run: |
          echo "MACOS_LIB_VER=$(brew list --versions glib gtk4 libadwaita | tr '\n' '_')" >> "$GITHUB_ENV"

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg

      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Windows'
        with:
          prefix-key: ${{ env.MACOS_LIB_VER }}

      - name: cargo build (Unix)
        if: runner.os != 'Windows' && matrix.job == 'build'
        run: cargo build

      - name: cargo build & smoke test (Windows)
        if: runner.os == 'Windows' && matrix.job == 'build'
        shell: msys2 {0}
        run: |
          cargo build
          ./target/debug/lan-mouse.exe doctor --probe --json

      - name: cargo check (Unix)
        if: runner.os != 'Windows' && matrix.job == 'check'
        run: cargo check --workspace --all-targets --all-features

      - name: cargo check (Windows)
        if: runner.os == 'Windows' && matrix.job == 'check'
        shell: msys2 {0}
        run: cargo check --workspace --all-targets

      - name: cargo test (Unix)
        if: runner.os != 'Windows' && matrix.job == 'test'
        run: cargo test --workspace --all-features

      - name: cargo test (Windows)
        if: runner.os == 'Windows' && matrix.job == 'test'
        shell: msys2 {0}
        run: cargo test --workspace -- --test-threads=1

      - name: cargo clippy (Unix)
        if: runner.os != 'Windows' && matrix.job == 'clippy'
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          # Turn compiler/clippy diagnostics into check annotations so the
          # exact failure is visible through the public checks API even
          # without repository-admin access to the raw job log.
          {
            echo "--- linker error ---"
            grep -A20 'error: linking with' clippy.log 2>&1 || true
          } | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit "$status"

      - name: cargo clippy (Windows)
        if: runner.os == 'Windows' && matrix.job == 'clippy'
        shell: msys2 {0}
        env:
          CARGO_TERM_COLOR: never
          # `cargo clippy` resolves the build-script linker to link.exe on the
          # MSYS2 runner (LNK1181); force the MSYS2 GNU linker that the normal
          # build job uses successfully.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          {
            echo "--- linker error ---"
            grep -A20 'error: linking with' clippy.log 2>&1 || true
          } | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit "$status"
