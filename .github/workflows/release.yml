name: "Release"

on:
  push:
    branches: ["main"]
    tags:
      - v**
  workflow_dispatch:
    inputs:
      name:
        description: "Development release name"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-release-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libadwaita-1-dev libgtk-4-dev \
            libwayland-dev libxkbcommon-dev librsvg2-bin imagemagick
      - name: Release build
        run: cargo build --release
      - name: Collect binary
        run: |
          cp target/release/lan-mouse lan-mouse-linux-x86_64
          tar -czf lan-mouse-custom-linux-x86_64.tar.gz -C target/release lan-mouse
      - name: Build .deb
        # cargo-bundle is not used: version 0.12 pulls in sigstore, which no
        # longer compiles with current rustc.
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          ./scripts/package-deb.sh "$version"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-mouse-linux-x86_64
          path: |
            lan-mouse-linux-x86_64
            lan-mouse-custom-linux-x86_64.tar.gz
            lan-mouse-custom_*.deb

  windows-release-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # MSYS2 ships prebuilt GTK4/libadwaita for the mingw-w64 target, so the
      # job takes minutes instead of compiling GTK with gvsbuild (which also
      # depends on whichever Visual Studio version the runner happens to have).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
      - name: Release build
        shell: msys2 {0}
        run: cargo build --release
      - name: Create archive
        shell: msys2 {0}
        run: |
          mkdir -p lan-mouse-windows
          cp target/release/lan-mouse.exe lan-mouse-windows/
          ldd target/release/lan-mouse.exe \
            | awk '/\/ucrt64\/bin\// {print $3}' \
            | sort -u \
            | xargs -r cp -t lan-mouse-windows
          # GTK looks up its settings schemas next to the executable.
          mkdir -p lan-mouse-windows/share/glib-2.0
          cp -r /ucrt64/share/glib-2.0/schemas lan-mouse-windows/share/glib-2.0/
          glib-compile-schemas lan-mouse-windows/share/glib-2.0/schemas
      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path "lan-mouse-windows\*" -DestinationPath lan-mouse-windows-x86_64.zip
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DAPPVERSION=$version installer\windows\lan-mouse-custom.nsi
      - name: Smoke test silent installer and doctor probe
        shell: pwsh
        run: |
          # Regression guard for the reported bug: installing a release over an
          # older build must NOT resurrect the old PCs/certificates/permissions.
          # Seed stale per-user data and assert the silent installer moves it to
          # a timestamped backup (reversible clean install; silent default).
          $userData = Join-Path $env:LOCALAPPDATA "lan-mouse"
          $roamingData = Join-Path $env:APPDATA "lan-mouse"
          $unrelated = Join-Path $env:LOCALAPPDATA "lan-mouse-unrelated-keep.txt"
          New-Item -ItemType Directory -Force -Path $userData, $roamingData | Out-Null
          Set-Content -Path (Join-Path $userData "config.toml") -Value "# stale config from an older build"
          Set-Content -Path (Join-Path $userData "lan-mouse.pem") -Value "stale certificate"
          Set-Content -Path (Join-Path $roamingData "config.toml") -Value "# stale roaming config"
          Set-Content -Path $unrelated -Value "must survive the clean install"
          $p = Start-Process -FilePath ".\lan-mouse-custom-setup-x86_64.exe" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            echo "::error::installer exit code $($p.ExitCode)"
            throw "Installer failed with exit code $($p.ExitCode)"
          }
          if (Test-Path (Join-Path $userData "config.toml")) {
            echo "::error::installer did not clean the stale configuration in $userData"
            throw "Installer kept the stale user configuration in place"
          }
          $localBackups = @(Get-ChildItem -Path $env:LOCALAPPDATA -Directory -Filter "lan-mouse.bak-*" -ErrorAction SilentlyContinue)
          if ($localBackups.Count -eq 0) {
            echo "::error::installer did not create a lan-mouse.bak-* backup"
            throw "Installer did not create a reversible backup"
          }
          if (-not (Get-ChildItem -Path $localBackups[0].FullName -Filter "config.toml" -ErrorAction SilentlyContinue)) {
            echo "::error::backup $($localBackups[0].FullName) does not contain the stale config.toml"
            throw "Installer backup is missing the stale configuration"
          }
          if (Test-Path (Join-Path $roamingData "config.toml")) {
            echo "::error::installer did not back up the stale roaming configuration in $roamingData"
            throw "Installer kept the stale roaming configuration in place"
          }
          if (-not (Test-Path $unrelated)) {
            echo "::error::installer deleted an unrelated file: $unrelated"
            throw "Installer must not delete unrelated files"
          }
          $exe = "C:\Program Files\Lan Mouse\lan-mouse.exe"
          if (-not (Test-Path $exe)) {
            echo "::error::installed binary missing at $exe"
            throw "Installed binary missing at $exe"
          }
          # The release binary is a GUI-subsystem executable. PowerShell's `&`
          # piping can miss its stdout; redirect through files instead so the
          # doctor JSON is reliably captured and failures are diagnosable.
          $stdout = Join-Path $env:RUNNER_TEMP "lan-mouse-doctor.json"
          $stderr = Join-Path $env:RUNNER_TEMP "lan-mouse-doctor.err"
          $doctor = Start-Process -FilePath $exe -ArgumentList "doctor", "--probe", "--json" `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          Write-Host "doctor exit code: $($doctor.ExitCode)"
          Get-Content $stdout, $stderr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          if ($doctor.ExitCode -ne 0) {
            echo "::error::doctor exited with $($doctor.ExitCode)"
            throw "doctor exited with $($doctor.ExitCode)"
          }
          $raw = Get-Content $stdout -Raw
          if ([string]::IsNullOrWhiteSpace($raw)) {
            echo "::error::doctor produced no JSON (stdout empty)"
            throw "doctor produced no JSON"
          }
          try {
            $json = $raw | ConvertFrom-Json
          } catch {
            echo "::error::could not parse doctor JSON: $($raw.Substring(0, [Math]::Min(300, $raw.Length)))"
            throw "could not parse doctor JSON"
          }
          if ($json.capture_probe.backend -ne "windows") {
            echo "::error::unexpected capture probe: $($json.capture_probe | ConvertTo-Json -Compress)"
            throw "Unexpected capture probe"
          }
          if ($json.emulation_probe.backend -ne "windows") {
            echo "::error::unexpected emulation probe: $($json.emulation_probe | ConvertTo-Json -Compress)"
            throw "Unexpected emulation probe"
          }
          $u = Start-Process -FilePath "C:\Program Files\Lan Mouse\uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          if ($u.ExitCode -ne 0) {
            echo "::error::uninstaller exit code $($u.ExitCode)"
            throw "Uninstaller failed with exit code $($u.ExitCode)"
          }
          # The silent uninstaller moves the per-user data to a backup
          # (recreated above by the doctor run); /KEEPUSERDATA keeps it in
          # place and /PURGEUSERDATA deletes it.
          if (Test-Path $userData) {
            echo "::error::uninstaller left the user data directory $userData"
            throw "Uninstaller left the user data directory in place"
          }
          if (Test-Path $roamingData) {
            echo "::error::uninstaller left the roaming data directory $roamingData"
            throw "Uninstaller left the roaming data directory in place"
          }
          $postUninstallBackups = @(Get-ChildItem -Path $env:LOCALAPPDATA -Directory -Filter "lan-mouse.bak-*" -ErrorAction SilentlyContinue)
          if ($postUninstallBackups.Count -lt 2) {
            echo "::error::expected backups from install and uninstall, found $($postUninstallBackups.Count)"
            throw "Uninstaller did not keep the user data reversible"
          }
          if (-not (Test-Path $unrelated)) {
            echo "::error::uninstaller deleted an unrelated file: $unrelated"
            throw "Uninstaller must not delete unrelated files"
          }
          # The runner is disposable, but clean the backups we seeded anyway.
          foreach ($backup in @(Get-ChildItem -Path $env:LOCALAPPDATA -Directory -Filter "lan-mouse.bak-*" -ErrorAction SilentlyContinue)) {
            Remove-Item -Recurse -Force $backup.FullName
          }
          foreach ($backup in @(Get-ChildItem -Path $env:APPDATA -Directory -Filter "lan-mouse.bak-*" -ErrorAction SilentlyContinue)) {
            Remove-Item -Recurse -Force $backup.FullName
          }
          Remove-Item -Force $unrelated -ErrorAction SilentlyContinue
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-mouse-windows-x86_64
          path: |
            lan-mouse-windows-x86_64.zip
            lan-mouse-custom-setup-x86_64.exe

  release:
    name: "Release"
    needs: [linux-release-build, windows-release-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
      - name: Get short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Publish pre-release (branch build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
          name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
          prerelease: true
          generate_release_notes: true
          files: |
            lan-mouse-linux-x86_64/lan-mouse-linux-x86_64
            lan-mouse-linux-x86_64/lan-mouse-custom-linux-x86_64.tar.gz
            lan-mouse-linux-x86_64/lan-mouse-custom_*.deb
            lan-mouse-windows-x86_64/lan-mouse-windows-x86_64.zip
            lan-mouse-windows-x86_64/lan-mouse-custom-setup-x86_64.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            lan-mouse-linux-x86_64/lan-mouse-linux-x86_64
            lan-mouse-linux-x86_64/lan-mouse-custom-linux-x86_64.tar.gz
            lan-mouse-linux-x86_64/lan-mouse-custom_*.deb
            lan-mouse-windows-x86_64/lan-mouse-windows-x86_64.zip
            lan-mouse-windows-x86_64/lan-mouse-custom-setup-x86_64.exe
