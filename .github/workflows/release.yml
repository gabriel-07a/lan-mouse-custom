name: "Release"

on:
  push:
    branches: ["main"]
    tags:
      - v**
  workflow_dispatch:
    inputs:
      name:
        description: "Development release name"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-release-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libadwaita-1-dev libgtk-4-dev \
            libwayland-dev libxkbcommon-dev librsvg2-bin imagemagick
      - name: Release build
        run: cargo build --release
      - name: Collect binary
        run: |
          cp target/release/lan-mouse lan-mouse-linux-x86_64
          tar -czf lan-mouse-custom-linux-x86_64.tar.gz -C target/release lan-mouse
      - name: Build .deb
        # cargo-bundle is not used: version 0.12 pulls in sigstore, which no
        # longer compiles with current rustc.
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          ./scripts/package-deb.sh "$version"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-mouse-linux-x86_64
          path: |
            lan-mouse-linux-x86_64
            lan-mouse-custom-linux-x86_64.tar.gz
            lan-mouse-custom_*.deb

  windows-release-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # needed for cache restore
      - name: create gtk dir
        run: mkdir C:\gtk-build\gtk\x64\release
      - uses: actions/cache@v4
        id: cache
        with:
          path: c:/gtk-build/gtk/x64/release/**
          key: gtk-windows-build-v2
          restore-keys: gtk-windows-build
      - name: Update path
        run: |
          echo "PKG_CONFIG=C:\gtk-build\gtk\x64\release\bin\pkgconf.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\gtk-build\gtk\x64\release\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          py -m venv .venv
          .venv\Scripts\activate.ps1
          py -m pip install gvsbuild
          # gvsbuild refuses to run while git's usr/bin is on PATH
          Move-Item "C:\Program Files\Git\usr\bin" "C:\Program Files\Git\usr\notbin"
          Move-Item "C:\Program Files\Git\bin" "C:\Program Files\Git\notbin"
          try {
            gvsbuild build --vs-ver=vs2022 --msys-dir=C:\msys64 gtk4 libadwaita librsvg
          } finally {
            Move-Item "C:\Program Files\Git\usr\notbin" "C:\Program Files\Git\usr\bin"
            Move-Item "C:\Program Files\Git\notbin" "C:\Program Files\Git\bin"
          }
      - name: Release build
        run: cargo build --release
      - name: Create archive
        shell: pwsh
        run: |
          mkdir "lan-mouse-windows"
          Get-Childitem -Path "C:\\gtk-build\\gtk\\x64\\release\\bin\\*.dll" -File -Recurse | Copy-Item -Destination "lan-mouse-windows"
          Copy-Item -Path "target\release\lan-mouse.exe" -Destination "lan-mouse-windows"
          Compress-Archive -Path "lan-mouse-windows\*" -DestinationPath lan-mouse-windows-x86_64.zip
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DAPPVERSION=$version installer\windows\lan-mouse-custom.nsi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-mouse-windows-x86_64
          path: |
            lan-mouse-windows-x86_64.zip
            lan-mouse-custom-setup-x86_64.exe

  release:
    name: "Release"
    needs: [linux-release-build, windows-release-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
      - name: Get short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Publish pre-release (branch build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
          name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
          prerelease: true
          generate_release_notes: true
          files: |
            lan-mouse-linux-x86_64/lan-mouse-linux-x86_64
            lan-mouse-linux-x86_64/lan-mouse-custom-linux-x86_64.tar.gz
            lan-mouse-linux-x86_64/lan-mouse-custom_*.deb
            lan-mouse-windows-x86_64/lan-mouse-windows-x86_64.zip
            lan-mouse-windows-x86_64/lan-mouse-custom-setup-x86_64.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            lan-mouse-linux-x86_64/lan-mouse-linux-x86_64
            lan-mouse-linux-x86_64/lan-mouse-custom-linux-x86_64.tar.gz
            lan-mouse-linux-x86_64/lan-mouse-custom_*.deb
            lan-mouse-windows-x86_64/lan-mouse-windows-x86_64.zip
            lan-mouse-windows-x86_64/lan-mouse-custom-setup-x86_64.exe
