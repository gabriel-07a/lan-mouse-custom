# cargo-nextest configuration for the test-quality jobs and local runs.
#
# Retries are deliberately zero: a flaky test is a bug, not noise to hide.
# Network/hardware smoke suites must be serialized explicitly once they exist.
[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "500ms"

[profile.ci]
retries = 0
fail-fast = false
