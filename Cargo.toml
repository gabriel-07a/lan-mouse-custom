[workspace]
exclude = ["lan-mouse-gpui", "spike/gpui"]
members = [
    "input-capture",
    "input-clipboard",
    "input-emulation",
    "input-event",
    "lan-mouse-ipc",
    "lan-mouse-cli",
    "lan-mouse-gtk",
    "lan-mouse-proto",
    "lan-mouse-test-support",
]

[package]
name = "lan-mouse"
description = "Software KVM Switch / mouse & keyboard sharing software for Local Area Networks"
version = "0.2.13"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/gabriel-07a/lan-mouse-custom"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

[build-dependencies]
shadow-rs = "1.2.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
lan-mouse-test-support = { path = "lan-mouse-test-support" }

[dependencies]
input-clipboard = { path = "input-clipboard", version = "0.1.0" }
input-event = { path = "input-event", version = "0.4.0" }
input-emulation = { path = "input-emulation", version = "0.4.0", default-features = false }
input-capture = { path = "input-capture", version = "0.4.0", default-features = false }
lan-mouse-cli = { path = "lan-mouse-cli", version = "0.3.0" }
lan-mouse-gtk = { path = "lan-mouse-gtk", version = "0.3.0", optional = true }
lan-mouse-ipc = { path = "lan-mouse-ipc", version = "0.3.0" }
lan-mouse-proto = { path = "lan-mouse-proto", version = "0.3.0" }
# The generated shadow.rs only needs the `shadow!` macro and `formatcp!`
# re-export, so the runtime dependency takes no default features (shadow-rs
# documents this setup). Keeping the defaults here pulled git2/libgit2-sys and
# tzdb into the shipped binary's dependency graph for no runtime benefit.
shadow-rs = { version = "1.2.0", default-features = false, features = ["metadata"] }

toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.20"
env_logger = "0.11.3"
serde_json = "1.0.107"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "signal",
] }
futures = "0.3.28"
clap = { version = "4.4.11", features = ["derive"] }
slab = "0.4.9"
thiserror = "2.0.0"
tokio-util = "0.7.11"
local-channel = "0.1.5"
webrtc-dtls = { version = "0.12.0", features = ["pem"] }
webrtc-util = "0.11.0"
rustls = { version = "0.23.12", default-features = false, features = [
    "std",
    "ring",
] }
rcgen = "0.13.1"
sha2 = "0.10.8"
notify = "8.2.0"
if-addrs = "0.15.0"
hostname = "0.4.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_HiDpi",
] }

[features]
default = [
    "gpui",
    "layer_shell_capture",
    "x11_capture",
    "libei_capture",
    "wlroots_emulation",
    "libei_emulation",
    "rdp_emulation",
    "x11_emulation",
]
gtk = ["dep:lan-mouse-gtk"]
gpui = []
layer_shell_capture = ["input-capture/layer_shell"]
# NOTE: the X11 *capture* backend is a stub in this fork (always
# NotImplemented); X11 sessions are receive-only. X11 output is provided by
# x11_emulation. Kept for upstream parity/feature completeness.
x11_capture = ["input-capture/x11"]
libei_capture = ["input-event/libei", "input-capture/libei"]
libei_emulation = ["input-event/libei", "input-emulation/libei"]
wlroots_emulation = ["input-emulation/wlroots"]
x11_emulation = ["input-emulation/x11"]
rdp_emulation = ["input-emulation/remote_desktop_portal"]


